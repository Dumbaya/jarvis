# PHP-FPM(app)으로 넘기는 공통 설정. 이 앱은 API만 제공하므로 모든 요청이 index.php로 간다.
# SCRIPT_FILENAME은 PHP-FPM 컨테이너 안의 경로라서 nginx가 코드를 가지고 있을 필요가 없다.
fastcgi_pass app:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param HTTPS on;
# 자비스 대화는 LLM 호출(체인 최대 3개) + 도구 호출을 거치므로 길어질 수 있다. php.ini의 max_execution_time(100초)보다 길게 둔다.
fastcgi_read_timeout 120s;
