server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# 내부 호출 전용 서버. 자비스 도구 호출과 브리핑이 사용한다(JARVIS_INTERNAL_URL=http://nginx:8081).
# docker-compose에서 호스트로 포트를 열지 않으므로 컨테이너 네트워크 안에서만 닿는다. 운영에서도 이 포트를 바깥에 열면 안 된다.
# 별도 PHP-FPM 풀(app:9001)로 보내서, 바깥 요청이 몰려도 안쪽 호출이 워커를 못 구해 교착되는 일을 막는다.
server {
    listen 8081;
    server_name _;
    root /var/www/html/public;

    # API 경로만 받는다. 나머지는 열지 않는다.
    location / {
        return 404;
    }

    location ^~ /api/ {
        fastcgi_pass app:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 30s;
    }
}
