; 운영용 워커 풀 크기. 작은 서버(메모리 1GB 안팎)를 기준으로 잡았다. 워커 하나는 대략 30~50MB를 쓴다.
;
; ondemand: 요청이 없으면 워커를 두지 않아 평소 메모리를 아낀다(첫 요청은 워커를 띄우는 시간이 조금 든다).
; www       바깥에서 들어오는 요청. 서버 메모리에 맞춰 키운다.
; internal  자비스 도구 호출과 브리핑이 PHP에서 같은 서버 API를 다시 부를 때만 쓰는 풀(포트 9001, 호스트로 열지 않음).
;           동시에 대화하는 사용자 수만큼은 있어야 한다. 이 풀을 바깥 풀과 분리한 이유는 docs/DECISIONS.md의 교착 사고를 본다.
[www]
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 20s
pm.max_requests = 500

[internal]
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500
