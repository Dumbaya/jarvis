; 내부 호출 전용 PHP-FPM 풀.
;
; 자비스 도구 호출과 브리핑은 PHP가 같은 서버의 API를 HTTP로 다시 부른다. 이 호출이 바깥 요청과 같은 워커 풀을
; 쓰면, 워커 N개가 전부 "바깥 요청이 안쪽 호출을 기다리는" 상태가 되어 서로를 기다리며 멈춘다(교착).
; 안쪽 호출을 별도 풀(포트 9001)로 보내면 바깥 요청이 아무리 몰려도 안쪽 호출은 항상 처리되어 교착이 생기지 않는다.
; 안쪽 호출은 다시 바깥으로 나가지 않으므로(말단) 이 풀 안에서는 순환 대기가 없다.
[internal]
user = www-data
group = www-data
listen = 9001

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.process_idle_timeout = 10s

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
