# 운영용 compose. 개발용(docker-compose.yml)과 달리 코드를 마운트하지 않고, DB 포트를 열지 않으며, TLS를 쓴다.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# .env.prod는 저장소에 올리지 않는다(.env.prod.example을 복사해서 채운다). 자세한 절차는 docs/OPERATIONS.md.
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # 8081(내부 호출 전용)은 일부러 열지 않는다.
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME(API 도메인)을 .env.prod에 지정하세요}
    volumes:
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/fastcgi-api.conf:/etc/nginx/snippets/fastcgi-api.conf:ro
      # Let's Encrypt 인증서(certbot이 만든다). 로컬 검증에는 자체 서명 인증서가 든 폴더를 지정한다.
      - ${CERTS_DIR:-./docker/certs}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-./docker/certbot-webroot}:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    # CI가 빌드해서 레지스트리(GHCR)에 올린 이미지를 쓴다. 없으면 build 설정으로 이 서버에서 직접 빌드한다.
    image: ${APP_IMAGE:-jarvis-app:local}
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # DB 접속 정보는 아래 db 서비스와 같은 값을 쓰도록 한 곳(POSTGRES_*)에서만 정한다.
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-jarvis}
      DB_USERNAME: ${POSTGRES_USER:-jarvis}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env.prod에 지정하세요}
      # 자비스 도구 호출은 내부 전용 서버(nginx:8081, 별도 PHP-FPM 풀)로 보낸다.
      JARVIS_INTERNAL_URL: http://nginx:8081
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 프로세스 이름(php-fpm: master process ...)이 아니라, 바깥 풀(9000)과 내부 풀(9001)이 실제로 연결을 받는지 확인한다.
      test: ["CMD-SHELL", "php -r 'foreach ([9000, 9001] as $$p) { $$s = @fsockopen(\"127.0.0.1\", $$p, $$e, $$m, 2); if (!$$s) { exit(1); } fclose($$s); }'"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 호스트로 포트를 열지 않는다. 같은 compose 네트워크의 app만 접속한다.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env.prod에 지정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  app_storage:
