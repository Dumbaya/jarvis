name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 푸시가 오면 이전 실행은 취소한다(낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"

jobs:
  # 코드 스타일(Laravel Pint). 스타일 논쟁을 리뷰에서 빼고 기계가 잡는다.
  backend-style:
    name: Backend 스타일
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: ./vendor/bin/pint --test

  # SQLite(메모리) 테스트. 빠르고 DB 서비스가 필요 없다. Postgres 전용 테스트는 건너뛴다.
  backend-sqlite:
    name: Backend 테스트 (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, bcmath, zip, pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # 실제 PostgreSQL(pgvector) 테스트. 배타 제약(이중 예약 방지), CHECK 제약, pgvector 거리 계산처럼
  # SQLite로는 검증할 수 없는 것들이 여기서 돈다. 이 작업이 통과해야 운영 DB와 같은 조건에서 검증된 것이다.
  backend-postgres:
    name: Backend 테스트 (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: jarvis_test
      DB_USERNAME: jarvis
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, bcmath, zip, pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  frontend:
    name: Frontend 타입 검사와 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # React Router 8은 Node 22.22 이상을 요구한다. "22"는 22.x 최신으로 풀린다.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api

  # 운영 이미지가 빌드되는지, 운영 compose와 nginx 설정이 유효한지. 배포하다가 처음 발견하지 않게 미리 본다.
  docker:
    name: 운영 이미지와 설정 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 운영 이미지 빌드(푸시하지 않음)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: false
          tags: jarvis-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 운영 compose 문법 검사
        env:
          SERVER_NAME: api.example.com
          POSTGRES_PASSWORD: ci-only
        run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml config --quiet
      - name: nginx 설정 검사
        run: |
          mkdir -p certs/live/localhost
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout certs/live/localhost/privkey.pem -out certs/live/localhost/fullchain.pem
          # 설정이 app 호스트를 참조하므로 임시로 가리킬 곳을 준다(시작이 아니라 문법 검사만 하는 것이다).
          docker run --rm --add-host app:127.0.0.1 -e SERVER_NAME=localhost \
            -v "$PWD/docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/docker/nginx/fastcgi-api.conf:/etc/nginx/snippets/fastcgi-api.conf:ro" \
            -v "$PWD/certs:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t
      - name: 셸 스크립트 문법 검사
        run: for f in scripts/*.sh docker/php/*.sh; do bash -n "$f" && echo "ok $f"; done
