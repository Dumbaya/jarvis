name: Deploy

# 자동으로 배포하지 않는다. 직접 실행하거나(Actions 탭 → Run workflow) 버전 태그(v1.0.0 등)를 푸시했을 때만 돈다.
# 운영 서버에 접속하는 작업이라 GitHub의 "production" 환경에 승인자를 지정해 두는 것을 권한다(Settings → Environments).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 배포가 겹치면 DB 마이그레이션이 동시에 돌 수 있으니 한 번에 하나만, 진행 중인 것은 취소하지 않고 기다린다.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 이미지를 이 서버에서 빌드하지 않고 여기서 만들어 GHCR에 올린다. 메모리가 작은 서버에서는 빌드가 실패하기 쉽다.
  build:
    name: 이미지 빌드와 푸시
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # 이미지 이름은 소문자여야 한다. metadata-action이 저장소 이름을 소문자로 바꿔 준다.
          images: ghcr.io/${{ github.repository }}-app
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버에 배포
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH 설정
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 호스트 키를 미리 등록해 둔 값으로 고정한다(첫 접속 때 아무 키나 믿는 것을 막는다).
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 배포 실행
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}
          SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
          SMOKE_ORIGIN: ${{ secrets.DEPLOY_SMOKE_ORIGIN }}
        run: |
          # 서버에서 최신 스크립트와 설정을 받고, 방금 올린 이미지로 deploy.sh(백업 → 기동 → 마이그레이션 → 점검)를 실행한다.
          # 서버에는 사전에 docker login ghcr.io가 되어 있어야 한다(패키지가 비공개일 때). docs/OPERATIONS.md 참고.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && APP_IMAGE='$IMAGE' SMOKE_URL='$SMOKE_URL' SMOKE_ORIGIN='$SMOKE_ORIGIN' scripts/deploy.sh"
